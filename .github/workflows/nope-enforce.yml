name: NOPE policy smoke test

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check active policy
        run: |
          python -m pip install semgrep
          sh scripts/enforce.sh
