[project]
name = "nope-core"
version = "1.0.0"
description = "Never-Again Compiler core: Switch workflow for turning team lessons into CI-enforced safeguards."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Praveen"}]
dependencies = [
  "fastapi>=0.116",
  "uvicorn[standard]>=0.35",
  "pydantic>=2.11",
  "sqlalchemy>=2.0",
  "alembic>=1.16",
  "psycopg[binary]>=3.2",
  "httpx>=0.28",
  "PyYAML>=6.0",
  "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4",
  "pytest-asyncio>=1.1",
  "ruff>=0.12",
  "mypy>=1.17",
  "types-PyYAML>=6.0",
]
semgrep = ["semgrep>=1.131"]

[project.scripts]
nope = "nope_core.cli:main"
nope-demo = "nope_core.demo:main"
nope-report = "nope_core.reporter:main"
nope-room = "nope_switch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/core/src/nope_core", "apps/switch/src/nope_switch"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["apps/core/src", "apps/switch/src"]

[tool.pytest.ini_options]
pythonpath = ["apps/core/src", "apps/switch/src"]
testpaths = ["apps/core/tests"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "session"
