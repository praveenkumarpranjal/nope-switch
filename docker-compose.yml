services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nope
      POSTGRES_USER: nope
      POSTGRES_PASSWORD: ${NOPE_DB_PASSWORD:-nope-local-only-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nope -d nope"]
      interval: 5s
      timeout: 3s
      retries: 20

  nope-core:
    build: .
    ports:
      - "127.0.0.1:8010:8010"
    environment:
      DATABASE_URL: postgresql+psycopg://nope:${NOPE_DB_PASSWORD:-nope-local-only-change-me}@postgres:5432/nope
      NOPE_API_KEYS: ${NOPE_API_KEYS:-admin-change-me:admin,approver-change-me:approver,agent-change-me:agent,challenger-change-me:agent,ci-change-me:ci}
      NOPE_ENV: production
      NOPE_SCAN_ROOT: /workspace
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - nope-state:/var/lib/nope
      - .:/workspace:ro
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  nope-state:
